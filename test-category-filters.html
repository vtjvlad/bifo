<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест фильтров категории - Смартфоны</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .dynamic-filter {
            border: 1px solid #e0e0e0;
            border-radius: 5px;
            padding: 10px;
            margin-bottom: 15px;
            background: #f9f9f9;
        }
        .filter-values {
            max-height: 200px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <div class="container mt-4">
        <div class="row">
            <div class="col-md-12">
                <div class="alert alert-info">
                    <h4><i class="fas fa-info-circle me-2"></i>Тестирование фильтров</h4>
                    <p>Это тестовая страница для демонстрации работы динамических фильтров.</p>
                    <p>URL категории: <code>smartphones</code> | Section ID: <code>11</code></p>
                    <button class="btn btn-primary btn-sm" onclick="createAndLoadFilters()">
                        <i class="fas fa-magic me-2"></i>Создать и загрузить тестовые фильтры
                    </button>
                </div>
            </div>
        </div>
        
        <div class="row">
            <!-- Filters Sidebar -->
            <div class="col-lg-3 col-md-4 mb-4">
                <div class="filters-sidebar">
                    <div class="card">
                        <div class="card-header">
                            <h5 class="mb-0">
                                <i class="fas fa-filter me-2"></i>
                                Фильтры
                            </h5>
                        </div>
                        <div class="card-body">
                            <!-- Price Filter -->
                            <div class="mb-4">
                                <h6>Цена</h6>
                                <div class="row g-2">
                                    <div class="col-6">
                                        <input type="number" class="form-control form-control-sm" 
                                               id="minPrice" placeholder="От" min="0">
                                    </div>
                                    <div class="col-6">
                                        <input type="number" class="form-control form-control-sm" 
                                               id="maxPrice" placeholder="До" min="0">
                                    </div>
                                </div>
                            </div>

                            <!-- Promo Filter -->
                            <div class="mb-4">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="promoFilter">
                                    <label class="form-check-label" for="promoFilter">
                                        <i class="fas fa-tag me-2 text-warning"></i>
                                        Только акционные товары
                                    </label>
                                </div>
                            </div>

                            <!-- Dynamic Filters Container -->
                            <div id="dynamicFiltersContainer">
                                <div class="text-center">
                                    <i class="fas fa-spinner fa-spin"></i>
                                    <p class="mt-2">Загружаем фильтры...</p>
                                </div>
                            </div>

                            <!-- Sort Options -->
                            <div class="mb-4">
                                <h6>Сортировка</h6>
                                <select class="form-select form-select-sm" id="sortSelect">
                                    <option value="createdAt:desc">Сначала новые</option>
                                    <option value="createdAt:asc">Сначала старые</option>
                                    <option value="currentPrice:asc">По возрастанию цены</option>
                                    <option value="currentPrice:desc">По убыванию цены</option>
                                    <option value="title:asc">По названию А-Я</option>
                                    <option value="title:desc">По названию Я-А</option>
                                </select>
                            </div>

                            <!-- Apply Filters Button -->
                            <button class="btn btn-primary btn-sm w-100" id="applyFilters">
                                <i class="fas fa-search me-2"></i>
                                Применить фильтры
                            </button>
                            
                            <!-- Reset Filters Button -->
                            <button class="btn btn-outline-secondary btn-sm w-100 mt-2" id="resetFilters" style="display: none;">
                                <i class="fas fa-times me-2"></i>
                                Сбросить фильтры
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Main Content -->
            <div class="col-lg-9 col-md-8">
                <div class="card">
                    <div class="card-header">
                        <h5><i class="fas fa-mobile-alt me-2"></i>Смартфоны</h5>
                    </div>
                    <div class="card-body">
                        <div id="filtersStatus">
                            <p class="text-muted">Состояние фильтров будет отображаться здесь</p>
                        </div>
                        
                        <div id="activeFilters" style="display: none;">
                            <h6>Активные фильтры:</h6>
                            <div id="activeFiltersList"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const apiBase = '/api';
        let availableFilters = [];

        async function createAndLoadFilters() {
            try {
                // Создаем тестовые фильтры
                const createResponse = await fetch('/create-test-filters', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });
                const createData = await createResponse.json();
                
                if (createData.success) {
                    console.log('✅ Тестовые фильтры созданы');
                    // Загружаем фильтры
                    await loadFilters();
                } else {
                    console.error('❌ Ошибка создания:', createData.error);
                }
            } catch (error) {
                console.error('❌ Ошибка:', error);
            }
        }

        async function loadFilters() {
            try {
                // Пробуем загрузить по sectionId (11 для смартфонов)
                const response = await fetch(`${apiBase}/filters/section/11`);
                const data = await response.json();
                
                if (data.success && data.data.length > 0) {
                    availableFilters = data.data;
                    renderFilters();
                    updateStatus(`✅ Загружено ${data.data.length} фильтров по sectionId=11`);
                } else {
                    updateStatus('❌ Фильтры не найдены. Создайте тестовые данные.');
                }
            } catch (error) {
                updateStatus(`❌ Ошибка загрузки: ${error.message}`);
            }
        }

        function renderFilters() {
            const container = document.getElementById('dynamicFiltersContainer');
            
            let filtersHTML = '';
            availableFilters.forEach(filter => {
                filtersHTML += renderSingleFilter(filter);
            });
            
            container.innerHTML = filtersHTML;
            attachFilterListeners();
            
            // Показываем кнопку сброса
            document.getElementById('resetFilters').style.display = 'block';
        }

        function renderSingleFilter(filter) {
            switch (filter.type) {
                case 'checkbox':
                    return renderCheckboxFilter(filter);
                case 'range':
                    return renderRangeFilter(filter);
                case 'select':
                    return renderSelectFilter(filter);
                default:
                    return renderCheckboxFilter(filter);
            }
        }

        function renderCheckboxFilter(filter) {
            const values = filter.values || [];
            return `
                <div class="mb-4 dynamic-filter" data-filter-id="${filter._id}">
                    <h6>${filter.title}</h6>
                    ${filter.description ? `<small class="text-muted">${filter.description}</small>` : ''}
                    <div class="filter-values">
                        ${values.map(value => `
                            <div class="form-check">
                                <input class="form-check-input filter-checkbox" 
                                       type="checkbox" 
                                       id="filter_${filter._id}_${value._id}"
                                       data-filter-id="${filter._id}"
                                       data-value-id="${value._id}"
                                       value="${value._id}">
                                <label class="form-check-label" for="filter_${filter._id}_${value._id}">
                                    ${value.title}
                                    ${value.productsCount > 0 ? `<span class="text-muted">(${value.productsCount})</span>` : ''}
                                </label>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function renderRangeFilter(filter) {
            return `
                <div class="mb-4 dynamic-filter" data-filter-id="${filter._id}">
                    <h6>${filter.title}</h6>
                    ${filter.description ? `<small class="text-muted">${filter.description}</small>` : ''}
                    <div class="row g-2">
                        <div class="col-6">
                            <input type="number" 
                                   class="form-control form-control-sm filter-range-min" 
                                   data-filter-id="${filter._id}"
                                   placeholder="От" 
                                   min="0">
                        </div>
                        <div class="col-6">
                            <input type="number" 
                                   class="form-control form-control-sm filter-range-max" 
                                   data-filter-id="${filter._id}"
                                   placeholder="До" 
                                   min="0">
                        </div>
                    </div>
                </div>
            `;
        }

        function renderSelectFilter(filter) {
            const values = filter.values || [];
            return `
                <div class="mb-4 dynamic-filter" data-filter-id="${filter._id}">
                    <h6>${filter.title}</h6>
                    ${filter.description ? `<small class="text-muted">${filter.description}</small>` : ''}
                    <select class="form-select form-select-sm filter-select" 
                            data-filter-id="${filter._id}">
                        <option value="">Выберите ${filter.title.toLowerCase()}</option>
                        ${values.map(value => `
                            <option value="${value._id}">${value.title}</option>
                        `).join('')}
                    </select>
                </div>
            `;
        }

        function attachFilterListeners() {
            document.querySelectorAll('.filter-checkbox, .filter-range-min, .filter-range-max, .filter-select').forEach(input => {
                input.addEventListener('change', handleFilterChange);
            });

            document.getElementById('applyFilters').addEventListener('click', handleFilterChange);
            document.getElementById('resetFilters').addEventListener('click', resetAllFilters);
        }

        function handleFilterChange() {
            const activeFilters = collectActiveFilters();
            displayActiveFilters(activeFilters);
        }

        function collectActiveFilters() {
            const filters = {};

            // Базовые фильтры
            const minPrice = document.getElementById('minPrice').value;
            const maxPrice = document.getElementById('maxPrice').value;
            const isPromo = document.getElementById('promoFilter').checked;

            if (minPrice) filters.minPrice = minPrice;
            if (maxPrice) filters.maxPrice = maxPrice;
            if (isPromo) filters.isPromo = 'true';

            // Динамические фильтры
            document.querySelectorAll('.filter-checkbox:checked').forEach(checkbox => {
                const filterId = checkbox.dataset.filterId;
                const valueId = checkbox.dataset.valueId;
                
                if (!filters[filterId]) filters[filterId] = [];
                filters[filterId].push(valueId);
            });

            document.querySelectorAll('.filter-select').forEach(select => {
                if (select.value) {
                    filters[select.dataset.filterId] = select.value;
                }
            });

            document.querySelectorAll('.dynamic-filter').forEach(filterEl => {
                const filterId = filterEl.dataset.filterId;
                const minInput = filterEl.querySelector('.filter-range-min');
                const maxInput = filterEl.querySelector('.filter-range-max');
                
                if (minInput && maxInput && (minInput.value || maxInput.value)) {
                    filters[filterId] = {
                        min: minInput.value || null,
                        max: maxInput.value || null
                    };
                }
            });

            return filters;
        }

        function displayActiveFilters(filters) {
            const activeFiltersDiv = document.getElementById('activeFilters');
            const activeFiltersList = document.getElementById('activeFiltersList');
            
            if (Object.keys(filters).length === 0) {
                activeFiltersDiv.style.display = 'none';
                return;
            }

            let html = '';
            for (const [key, value] of Object.entries(filters)) {
                if (Array.isArray(value)) {
                    html += `<span class="badge bg-primary me-2 mb-2">${key}: ${value.join(', ')}</span>`;
                } else if (typeof value === 'object') {
                    html += `<span class="badge bg-info me-2 mb-2">${key}: ${value.min || 0} - ${value.max || '∞'}</span>`;
                } else {
                    html += `<span class="badge bg-secondary me-2 mb-2">${key}: ${value}</span>`;
                }
            }

            activeFiltersList.innerHTML = html;
            activeFiltersDiv.style.display = 'block';
        }

        function resetAllFilters() {
            // Сбрасываем базовые фильтры
            document.getElementById('minPrice').value = '';
            document.getElementById('maxPrice').value = '';
            document.getElementById('promoFilter').checked = false;

            // Сбрасываем динамические фильтры
            document.querySelectorAll('.filter-checkbox').forEach(cb => cb.checked = false);
            document.querySelectorAll('.filter-range-min, .filter-range-max').forEach(input => input.value = '');
            document.querySelectorAll('.filter-select').forEach(select => select.selectedIndex = 0);

            document.getElementById('activeFilters').style.display = 'none';
        }

        function updateStatus(message) {
            document.getElementById('filtersStatus').innerHTML = `<p class="mb-0">${message}</p>`;
        }

        // Загружаем фильтры при загрузке страницы
        document.addEventListener('DOMContentLoaded', () => {
            loadFilters();
        });
    </script>
</body>
</html>
