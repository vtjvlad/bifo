<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Поиск товаров - Прайс-агрегатор</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #2563eb;
            --secondary-color: #1e40af;
            --accent-color: #f59e0b;
            --success-color: #10b981;
            --danger-color: #ef4444;
            --dark-color: #1f2937;
            --light-color: #f8fafc;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8fafc;
        }

        .navbar {
            background: rgba(255, 255, 255, 0.95) !important;
            backdrop-filter: blur(10px);
            box-shadow: 0 2px 20px rgba(0, 0, 0, 0.1);
        }

        .search-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 60px 0 40px;
        }

        .search-box {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .search-input {
            border: none;
            outline: none;
            font-size: 1.1rem;
            padding: 12px 20px;
            border-radius: 10px;
            width: 100%;
            background: transparent;
        }

        .search-btn {
            background: var(--primary-color);
            border: none;
            color: white;
            padding: 12px 25px;
            border-radius: 10px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .search-btn:hover {
            background: var(--secondary-color);
        }

        .filters-section {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }

        .product-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
            height: 100%;
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.15);
        }

        .product-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 10px 10px 0 0;
        }

        .price-badge {
            background: var(--success-color);
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-weight: 600;
        }

        .store-logo {
            width: 60px;
            height: 30px;
            object-fit: contain;
        }

        .price-comparison {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 15px;
            margin-top: 10px;
        }

        .store-price {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid #dee2e6;
        }

        .store-price:last-child {
            border-bottom: none;
        }

        .loading {
            text-align: center;
            padding: 50px;
            color: #6c757d;
        }

        .no-results {
            text-align: center;
            padding: 50px;
            color: #6c757d;
        }

        .pagination {
            justify-content: center;
            margin-top: 30px;
        }

        .filter-btn {
            background: var(--light-color);
            border: 1px solid #dee2e6;
            color: var(--dark-color);
            padding: 8px 15px;
            border-radius: 8px;
            margin: 5px;
            transition: all 0.3s ease;
        }

        .filter-btn:hover, .filter-btn.active {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }
    </style>
</head>
<body>
    <!-- Навигация -->
    <nav class="navbar navbar-expand-lg navbar-light fixed-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">
                <i class="fas fa-chart-line text-primary me-2"></i>
                Прайс-агрегатор
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/#features">Возможности</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/#stats">Статистика</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/api">API</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Заголовок поиска -->
    <section class="search-header">
        <div class="container">
            <div class="search-box">
                <div class="row">
                    <div class="col-md-8">
                        <input type="text" class="search-input" placeholder="Введите название товара..." id="searchInput" value="">
                    </div>
                    <div class="col-md-4">
                        <button class="search-btn w-100" onclick="searchProducts()">
                            <i class="fas fa-search me-2"></i>Найти
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Основной контент -->
    <section class="py-4">
        <div class="container">
            <div class="row">
                <!-- Фильтры -->
                <div class="col-lg-3">
                    <div class="filters-section">
                        <h5 class="mb-3">Фильтры</h5>
                        
                        <!-- Категории -->
                        <div class="mb-3">
                            <label class="form-label">Категория</label>
                            <select class="form-select" id="categoryFilter">
                                <option value="">Все категории</option>
                            </select>
                        </div>

                        <!-- Бренды -->
                        <div class="mb-3">
                            <label class="form-label">Бренд</label>
                            <select class="form-select" id="brandFilter">
                                <option value="">Все бренды</option>
                            </select>
                        </div>

                        <!-- Цена -->
                        <div class="mb-3">
                            <label class="form-label">Цена (₴)</label>
                            <div class="row">
                                <div class="col-6">
                                    <input type="number" class="form-control" id="minPrice" placeholder="От">
                                </div>
                                <div class="col-6">
                                    <input type="number" class="form-control" id="maxPrice" placeholder="До">
                                </div>
                            </div>
                        </div>

                        <!-- Магазины -->
                        <div class="mb-3">
                            <label class="form-label">Магазины</label>
                            <div id="storesFilter">
                                <!-- Магазины будут загружены динамически -->
                            </div>
                        </div>

                        <!-- Сортировка -->
                        <div class="mb-3">
                            <label class="form-label">Сортировка</label>
                            <select class="form-select" id="sortBy">
                                <option value="name">По названию</option>
                                <option value="price">По цене (возрастание)</option>
                                <option value="-price">По цене (убывание)</option>
                                <option value="stores">По количеству магазинов</option>
                            </select>
                        </div>

                        <button class="btn btn-primary w-100" onclick="applyFilters()">
                            Применить фильтры
                        </button>
                    </div>
                </div>

                <!-- Результаты поиска -->
                <div class="col-lg-9">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h5>Результаты поиска</h5>
                        <span class="text-muted" id="resultsCount">0 товаров</span>
                    </div>

                    <!-- Загрузка -->
                    <div id="loading" class="loading" style="display: none;">
                        <i class="fas fa-spinner fa-spin fa-2x mb-3"></i>
                        <p>Загрузка товаров...</p>
                    </div>

                    <!-- Нет результатов -->
                    <div id="noResults" class="no-results" style="display: none;">
                        <i class="fas fa-search fa-2x mb-3"></i>
                        <p>Товары не найдены</p>
                        <small>Попробуйте изменить параметры поиска</small>
                    </div>

                    <!-- Список товаров -->
                    <div class="row" id="productsList">
                        <!-- Товары будут загружены динамически -->
                    </div>

                    <!-- Пагинация -->
                    <nav aria-label="Навигация по страницам">
                        <ul class="pagination" id="pagination">
                            <!-- Пагинация будет загружена динамически -->
                        </ul>
                    </nav>
                </div>
            </div>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let currentPage = 1;
        let currentFilters = {};

        // Инициализация страницы
        document.addEventListener('DOMContentLoaded', function() {
            // Получаем параметры из URL
            const urlParams = new URLSearchParams(window.location.search);
            const query = urlParams.get('q');
            
            if (query) {
                document.getElementById('searchInput').value = query;
                searchProducts();
            }

            // Загружаем фильтры
            loadCategories();
            loadBrands();
            loadStores();
        });

        // Поиск товаров
        async function searchProducts() {
            const query = document.getElementById('searchInput').value;
            if (!query.trim()) return;

            showLoading();
            
            try {
                const params = new URLSearchParams({
                    search: query,
                    page: currentPage,
                    limit: 12,
                    ...currentFilters
                });

                const response = await fetch(`/api/products?${params}`);
                const data = await response.json();

                displayProducts(data.products);
                displayPagination(data.currentPage, data.totalPages);
                updateResultsCount(data.totalProducts);

                hideLoading();
            } catch (error) {
                console.error('Ошибка поиска:', error);
                hideLoading();
                showNoResults();
            }
        }

        // Отображение товаров
        function displayProducts(products) {
            const container = document.getElementById('productsList');
            container.innerHTML = '';

            if (!products || products.length === 0) {
                showNoResults();
                return;
            }

            products.forEach(product => {
                const productCard = createProductCard(product);
                container.appendChild(productCard);
            });
        }

        // Создание карточки товара
        function createProductCard(product) {
            const col = document.createElement('div');
            col.className = 'col-lg-4 col-md-6 mb-4';

            const minPrice = product.minPrice || 0;
            const maxPrice = product.maxPrice || 0;
            const priceText = minPrice === maxPrice ? 
                `${minPrice.toLocaleString()} ₴` : 
                `${minPrice.toLocaleString()} - ${maxPrice.toLocaleString()} ₴`;

            col.innerHTML = `
                <div class="product-card">
                    <img src="${product.images?.[0] || 'https://via.placeholder.com/300x200?text=Нет+изображения'}" 
                         class="product-image" alt="${product.name}">
                    <div class="p-3">
                        <h6 class="mb-2">${product.name}</h6>
                        <p class="text-muted small mb-2">${product.brand || 'Неизвестный бренд'}</p>
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <span class="price-badge">${priceText}</span>
                            <small class="text-muted">${product.storeCount || 0} магазинов</small>
                        </div>
                        
                        ${product.currentPrices && product.currentPrices.length > 0 ? `
                            <div class="price-comparison">
                                <small class="text-muted mb-2 d-block">Цены в магазинах:</small>
                                ${product.currentPrices.slice(0, 3).map(price => `
                                    <div class="store-price">
                                        <div class="d-flex align-items-center">
                                            <img src="${price.storeId?.logo || 'https://via.placeholder.com/60x30'}" 
                                                 class="store-logo me-2">
                                            <small>${price.storeId?.name || 'Магазин'}</small>
                                        </div>
                                        <small class="fw-bold">${price.price.toLocaleString()} ₴</small>
                                    </div>
                                `).join('')}
                            </div>
                        ` : ''}
                        
                        <button class="btn btn-outline-primary btn-sm w-100 mt-2" 
                                onclick="viewProduct('${product.id}')">
                            Подробнее
                        </button>
                    </div>
                </div>
            `;

            return col;
        }

        // Просмотр товара
        function viewProduct(productId) {
            window.location.href = `/product/${productId}`;
        }

        // Загрузка категорий
        async function loadCategories() {
            try {
                const response = await fetch('/api/products/categories/list');
                const categories = await response.json();
                
                const select = document.getElementById('categoryFilter');
                categories.forEach(category => {
                    const option = document.createElement('option');
                    option.value = category;
                    option.textContent = category;
                    select.appendChild(option);
                });
            } catch (error) {
                console.error('Ошибка загрузки категорий:', error);
            }
        }

        // Загрузка брендов
        async function loadBrands() {
            try {
                const response = await fetch('/api/products/brands/list');
                const brands = await response.json();
                
                const select = document.getElementById('brandFilter');
                brands.forEach(brand => {
                    const option = document.createElement('option');
                    option.value = brand;
                    option.textContent = brand;
                    select.appendChild(option);
                });
            } catch (error) {
                console.error('Ошибка загрузки брендов:', error);
            }
        }

        // Загрузка магазинов
        async function loadStores() {
            try {
                const response = await fetch('/api/stores');
                const data = await response.json();
                
                const container = document.getElementById('storesFilter');
                data.stores.forEach(store => {
                    const div = document.createElement('div');
                    div.className = 'form-check';
                    div.innerHTML = `
                        <input class="form-check-input" type="checkbox" value="${store._id}" id="store_${store._id}">
                        <label class="form-check-label" for="store_${store._id}">
                            ${store.name}
                        </label>
                    `;
                    container.appendChild(div);
                });
            } catch (error) {
                console.error('Ошибка загрузки магазинов:', error);
            }
        }

        // Применение фильтров
        function applyFilters() {
            currentFilters = {
                category: document.getElementById('categoryFilter').value,
                brand: document.getElementById('brandFilter').value,
                minPrice: document.getElementById('minPrice').value,
                maxPrice: document.getElementById('maxPrice').value,
                sortBy: document.getElementById('sortBy').value
            };

            // Получаем выбранные магазины
            const selectedStores = [];
            document.querySelectorAll('#storesFilter input:checked').forEach(input => {
                selectedStores.push(input.value);
            });
            if (selectedStores.length > 0) {
                currentFilters.stores = selectedStores.join(',');
            }

            currentPage = 1;
            searchProducts();
        }

        // Отображение пагинации
        function displayPagination(currentPage, totalPages) {
            const container = document.getElementById('pagination');
            container.innerHTML = '';

            if (totalPages <= 1) return;

            // Предыдущая страница
            if (currentPage > 1) {
                container.innerHTML += `
                    <li class="page-item">
                        <a class="page-link" href="#" onclick="goToPage(${currentPage - 1})">Предыдущая</a>
                    </li>
                `;
            }

            // Номера страниц
            for (let i = 1; i <= totalPages; i++) {
                if (i === currentPage) {
                    container.innerHTML += `
                        <li class="page-item active">
                            <span class="page-link">${i}</span>
                        </li>
                    `;
                } else {
                    container.innerHTML += `
                        <li class="page-item">
                            <a class="page-link" href="#" onclick="goToPage(${i})">${i}</a>
                        </li>
                    `;
                }
            }

            // Следующая страница
            if (currentPage < totalPages) {
                container.innerHTML += `
                    <li class="page-item">
                        <a class="page-link" href="#" onclick="goToPage(${currentPage + 1})">Следующая</a>
                    </li>
                `;
            }
        }

        // Переход на страницу
        function goToPage(page) {
            currentPage = page;
            searchProducts();
        }

        // Обновление счетчика результатов
        function updateResultsCount(count) {
            document.getElementById('resultsCount').textContent = `${count} товаров`;
        }

        // Показать загрузку
        function showLoading() {
            document.getElementById('loading').style.display = 'block';
            document.getElementById('noResults').style.display = 'none';
            document.getElementById('productsList').innerHTML = '';
        }

        // Скрыть загрузку
        function hideLoading() {
            document.getElementById('loading').style.display = 'none';
        }

        // Показать "нет результатов"
        function showNoResults() {
            document.getElementById('noResults').style.display = 'block';
            document.getElementById('productsList').innerHTML = '';
        }

        // Поиск по Enter
        document.getElementById('searchInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                searchProducts();
            }
        });
    </script>
</body>
</html>
