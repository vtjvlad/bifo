<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест фильтров</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container mt-4">
        <h1>Тест системы фильтров</h1>
        
        <div class="row">
            <div class="col-md-4">
                <div class="card">
                    <div class="card-header">
                        <h5><i class="fas fa-cog me-2"></i>Управление тестовыми данными</h5>
                    </div>
                    <div class="card-body">
                        <button class="btn btn-primary mb-2" onclick="createTestFilters()">
                            <i class="fas fa-plus me-2"></i>Создать тестовые фильтры
                        </button>
                        <button class="btn btn-info mb-2" onclick="testFiltersAPI()">
                            <i class="fas fa-play me-2"></i>Тестировать API
                        </button>
                        <button class="btn btn-success mb-2" onclick="loadFilters()">
                            <i class="fas fa-download me-2"></i>Загрузить фильтры
                        </button>
                    </div>
                </div>
                
                <div class="card mt-3">
                    <div class="card-header">
                        <h5><i class="fas fa-filter me-2"></i>Фильтры</h5>
                    </div>
                    <div class="card-body" id="filtersContainer">
                        <p class="text-muted">Нажмите "Загрузить фильтры" для отображения</p>
                    </div>
                </div>
            </div>
            
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header">
                        <h5><i class="fas fa-terminal me-2"></i>Лог операций</h5>
                    </div>
                    <div class="card-body">
                        <pre id="logContainer" style="height: 400px; overflow-y: auto; background: #f8f9fa; padding: 10px; border-radius: 5px;">
Готов к тестированию...
                        </pre>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const apiBase = '/api';
        const logContainer = document.getElementById('logContainer');
        
        function log(message) {
            const timestamp = new Date().toLocaleTimeString();
            logContainer.textContent += `[${timestamp}] ${message}\n`;
            logContainer.scrollTop = logContainer.scrollHeight;
        }
        
        async function createTestFilters() {
            log('Создание тестовых фильтров...');
            try {
                const response = await fetch('/create-test-filters', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });
                const data = await response.json();
                
                if (data.success) {
                    log(`✅ Создано ${data.count} тестовых фильтров`);
                } else {
                    log(`❌ Ошибка: ${data.error}`);
                }
            } catch (error) {
                log(`❌ Ошибка запроса: ${error.message}`);
            }
        }
        
        async function testFiltersAPI() {
            log('Тестирование API фильтров...');
            try {
                const response = await fetch('/test-filters');
                const data = await response.json();
                
                if (data.success) {
                    log(`✅ API работает. База: ${data.database}`);
                    log(`📊 Всего фильтров: ${data.totalFilters}`);
                    log(`📱 Фильтров для смартфонов: ${data.smartphoneFilters}`);
                } else {
                    log(`❌ Ошибка API: ${data.error}`);
                }
            } catch (error) {
                log(`❌ Ошибка запроса: ${error.message}`);
            }
        }
        
        async function loadFilters() {
            log('Загрузка фильтров для категории smartphones...');
            try {
                const response = await fetch(`${apiBase}/filters/category/smartphones`);
                const data = await response.json();
                
                if (data.success) {
                    log(`✅ Загружено ${data.data.length} фильтров`);
                    renderFilters(data.data);
                } else {
                    log(`❌ Ошибка загрузки: ${data.error}`);
                }
            } catch (error) {
                log(`❌ Ошибка запроса: ${error.message}`);
            }
        }
        
        function renderFilters(filters) {
            const container = document.getElementById('filtersContainer');
            
            if (filters.length === 0) {
                container.innerHTML = '<p class="text-muted">Фильтры не найдены</p>';
                return;
            }
            
            let html = '';
            filters.forEach(filter => {
                html += `
                    <div class="mb-3">
                        <h6>${filter.title}</h6>
                        <small class="text-muted">Тип: ${filter.type}</small>
                        ${filter.description ? `<br><small class="text-muted">${filter.description}</small>` : ''}
                        ${filter.values && filter.values.length > 0 ? `
                            <div class="mt-2">
                                <small class="text-success">Значений: ${filter.values.length}</small>
                                <ul class="list-unstyled ms-3">
                                    ${filter.values.slice(0, 3).map(value => 
                                        `<li><small>• ${value.title} ${value.productsCount ? `(${value.productsCount})` : ''}</small></li>`
                                    ).join('')}
                                    ${filter.values.length > 3 ? `<li><small>... и еще ${filter.values.length - 3}</small></li>` : ''}
                                </ul>
                            </div>
                        ` : ''}
                    </div>
                    <hr>
                `;
            });
            
            container.innerHTML = html;
        }
    </script>
</body>
</html>
